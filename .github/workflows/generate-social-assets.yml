name: Generate Caption IA social preview

on:
  push:
    branches: [main]
    paths:
      - scripts/generate_social_assets.py
      - .github/workflows/generate-social-assets.yml
      - public/favicon.svg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: captionia-social-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render deterministic PNG assets
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          python scripts/generate_social_assets.py
          python - <<'PY'
          from PIL import Image
          files = {
              'public/assets/og-captionia.png': (1200, 630),
              'public/favicon-32.png': (32, 32),
              'public/apple-touch-icon.png': (180, 180),
          }
          for filename, size in files.items():
              with Image.open(filename) as im:
                  assert im.size == size, (filename, im.size)
                  assert im.format == 'PNG', filename
          print('WhatsApp OG and favicons: OK')
          PY
      - name: Commit generated static assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/og-captionia.png public/favicon-32.png public/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo 'No changes to generated assets'
          else
            git commit -m "assets(seo): add WhatsApp social card and C favicon images"
            git push origin HEAD:main
          fi
