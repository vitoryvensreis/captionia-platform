name: Validate Caption IA Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring, openssl, pdo_mysql
          coverage: none

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax
        shell: bash
        run: |
          find app public views scripts tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: SEO and WhatsApp metadata smoke
        run: php tests/seo_metadata_test.php

      - name: Affiliate admin full view regression
        run: php tests/admin_affiliates_render_test.php

  financial-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: captionia_ci
          MYSQL_USER: captionia
          MYSQL_PASSWORD: integration_password
          MYSQL_ROOT_PASSWORD: integration_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring, openssl, pdo_mysql
          coverage: none
      - name: Install vendor
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Setup isolated test env
        shell: bash
        run: |
          cat > .env <<'ENV'
          APP_ENV=test
          APP_DEBUG=true
          APP_URL=https://caption.escotilhaprodutora.com
          APP_KEY=local-testing-key-only
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=captionia_ci
          DB_USERNAME=captionia
          DB_PASSWORD=integration_password
          SESSION_SECURE=false
          AFFILIATE_PAYOUT_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ENV
      - name: Validate migration is repeatable
        shell: bash
        run: |
          php scripts/install.php
          php scripts/install.php
      - name: Exercise money-sensitive workflows
        run: php tests/affiliate_finance_integration_test.php
      - name: Validate manual paid-order adjustments and immutable receipts
        run: php tests/admin_order_adjustments_test.php
