name: Validate Caption IA Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring, openssl, pdo_mysql
          coverage: none

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax
        shell: bash
        run: |
          find app public views scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
